<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四院校晚宴抽獎登錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep: #8e3f75;
    --deep-dark: #6f3160;
    --soft: #d09ba3;
    --blush: #fdf6f7;
    --cream: #fbeef1;
    --ink: #4a3040;
    --ink-soft: #8c7480;
    --line: #eeded4;
    --good: #4f8a68;
    --bad: #b6495a;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; padding: 32px 18px;
    font-family:'Noto Sans TC', sans-serif; color: var(--ink);
    background:
      radial-gradient(circle at 15% 0%, rgba(208,155,163,0.25), transparent 55%),
      radial-gradient(circle at 100% 10%, rgba(142,63,117,0.12), transparent 45%),
      var(--blush);
    display:flex; align-items:center; justify-content:center;
  }
  .card{
    width:100%; max-width: 420px; background:#fff; border-radius: 28px;
    padding: 40px 32px 34px; box-shadow: 0 20px 60px rgba(142,63,117,0.14);
    border: 1px solid #f4e7ea; position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:-60px; right:-60px; width:160px; height:160px;
    border-radius:50%; background: radial-gradient(circle, rgba(208,155,163,0.35), transparent 70%);
  }
  .eyebrow{
    font-size: 0.72rem; letter-spacing: 0.24em; color: var(--soft); font-weight:700;
    text-transform: uppercase; text-align:center; margin-bottom: 6px;
  }
  h1{
    font-family:'Noto Serif TC', serif; font-weight:700; font-size: 1.5rem;
    text-align:center; color: var(--deep-dark); margin: 0 0 4px;
  }
  .sub{ text-align:center; color: var(--ink-soft); font-size:0.88rem; margin-bottom: 28px; }
  .table-badge{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin: 0 auto 26px; width: fit-content; padding: 8px 20px;
    border-radius: 999px; background: var(--cream); color: var(--deep-dark);
    font-weight:700; font-size: 1.05rem; letter-spacing: 0.02em;
  }
  .table-badge span.no{ font-family:'Noto Serif TC', serif; font-size:1.3rem; color: var(--deep); }
  label{ display:block; font-size:0.82rem; font-weight:700; color: var(--ink-soft); margin: 0 0 6px; }
  .field{ margin-bottom: 18px; }
  input{
    width:100%; padding: 13px 16px; border-radius: 14px; border: 1.5px solid #eee0e3;
    background: #fffdfd; font-family: inherit; font-size: 1rem; color: var(--ink);
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus{ outline:none; border-color: var(--soft); box-shadow: 0 0 0 4px rgba(208,155,163,0.18); }
  button{
    width:100%; margin-top: 6px; padding: 14px; border:none; border-radius: 999px;
    background: linear-gradient(135deg, var(--deep), var(--deep-dark)); color:#fff;
    font-family: inherit; font-weight:700; font-size: 1rem; letter-spacing: 0.03em;
    cursor:pointer; box-shadow: 0 10px 24px rgba(142,63,117,0.28); transition: transform .15s, opacity .2s;
  }
  button:active{ transform: translateY(1px) scale(0.99); }
  button:disabled{ opacity:0.55; cursor:not-allowed; box-shadow:none; }
  .result{
    margin-top: 22px; border-radius: 18px; padding: 20px; text-align:center;
    font-size: 0.92rem; line-height:1.7; display:none;
  }
  .result.show{ display:block; }
  .result.green{ background:#f2f9f5; color: var(--good); border: 1px solid #d9ecdf; }
  .result.red{ background:#fdf1f2; color: var(--bad); border: 1px solid #f6d9dc; }
  .result.yellow{ background:#fdf8ee; color:#a2743a; border: 1px solid #f2e3c4; }
  .result .no{
    font-family:'Noto Serif TC', serif; font-size: 2.1rem; font-weight:700;
    color: var(--deep); display:block; margin: 4px 0 10px;
  }
  .result .meta{ color: var(--ink-soft); }
  .divider{ height:1px; background: linear-gradient(90deg, transparent, #f0dfe3, transparent); margin: 8px 0 18px; }
  .notice{
    background: var(--cream); border-radius: 14px; padding: 12px 16px; margin-bottom: 22px;
    font-size: 0.8rem; line-height: 1.6; color: var(--deep-dark);
  }
  .notice b{ color: var(--deep); }
  .screenshot-tip{
    margin-top: 14px; font-size: 0.8rem; color: var(--ink-soft); text-align:center; line-height:1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Lucky Draw Entry</div>
  <h1>四院校晚宴抽獎登錄</h1>
  <p class="sub">請填寫姓名與手機末四碼完成登錄</p>

  <div class="table-badge">第 <span class="no" id="tableNoLabel">—</span> 桌</div>

  <div class="notice">
	<b>每人限登錄 1 張抽獎券</b><br><b>每桌最多 10 張</b>，額滿即無法登錄，請把握機會！
  </div>
  <div class="divider"></div>

  <div class="field">
    <label>姓名</label>
    <input id="name" type="text" placeholder="請輸入姓名" autocomplete="name">
  </div>
  <div class="field">
    <label>手機末四碼</label>
    <input id="phone" type="tel" inputmode="numeric" maxlength="4" placeholder="例如：1234" autocomplete="off">
  </div>

  <button id="submitBtn">送出登錄</button>

  <div class="result" id="result"></div>
  <div class="screenshot-tip" id="screenshotTip" style="display:none;">
    📸 請將以上畫面截圖保存，作為現場領獎憑證
  </div>
</div>

<script>
// ------------ 設定區：請填入您的 Supabase 專案資訊 ------------
const SUPABASE_URL = 'https://ytfpmewrlsbvwgdfzknx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZnBtZXdybHNidndnZGZ6a254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzUzMTQsImV4cCI6MjA5NTExMTMxNH0.trs8nAs5oe7Qc_8FX3Y-z9yVvynAfu5omuvX-oHnm-4';
const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/lottery`;
// ---------------------------------------------------------------

const params = new URLSearchParams(window.location.search);
const tableNo = params.get('table');
document.getElementById('tableNoLabel').textContent = tableNo || '未指定';

async function callFn(action, data = {}) {
  const resp = await fetch(FUNCTION_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
    },
    body: JSON.stringify({ action, data }),
  });
  return resp.json();
}

function showResult(html, tone) {
  const box = document.getElementById('result');
  box.className = `result show ${tone}`;
  box.innerHTML = html;
}

document.getElementById('submitBtn').onclick = async () => {
  const nameInput = document.getElementById('name');
  const phoneInput = document.getElementById('phone');
  const btn = document.getElementById('submitBtn');

  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();

  if (!tableNo) return showResult('此連結未指定桌號，請掃描桌上的 QR Code。', 'red');
  if (!name || !phone) return showResult('請輸入姓名與手機末四碼。', 'red');
  if (!/^\d{3,4}$/.test(phone)) return showResult('手機末四碼格式不正確。', 'red');

  btn.disabled = true; btn.textContent = '送出中…';
  document.getElementById('screenshotTip').style.display = 'none';
  showResult('資料送出中，請稍候…', 'yellow');

  try {
    const res = await callFn('register', { table_no: Number(tableNo), name, phone });
    const tipEl = document.getElementById('screenshotTip');
    if (res.success) {
      const title = res.isNew ? '登錄成功！' : '您已登錄過抽獎券！';
      showResult(`
        <div style="font-weight:700; color:var(--deep-dark);">${title}</div>
        <span class="no">${res.details.fullNo}</span>
        <div class="meta">姓名：${res.details.name}　手機末四碼：${res.details.phone}</div>
      `, 'green');
      tipEl.style.display = 'block';
      nameInput.value = ''; phoneInput.value = '';
    } else {
      showResult(res.message || '登錄失敗，請重新嘗試。', 'red');
      tipEl.style.display = 'none';
    }
  } catch (e) {
    showResult('連線失敗，請檢查網路後再試一次。', 'red');
    document.getElementById('screenshotTip').style.display = 'none';
    console.error(e);
  } finally {
    btn.disabled = false; btn.textContent = '送出登錄';
  }
};
</script>
</body>
</html>
