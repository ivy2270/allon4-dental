<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中獎名單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#8e3f75; --deep-dark:#6f3160; --soft:#d09ba3;
    --blush:#fdf6f7; --cream:#fbeef1; --ink:#4a3040; --ink-soft:#8c7480;
    --claimed-bg:#f1ebee; --claimed-ink:#b3a3ac;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding: 28px 16px 60px; min-height:100vh;
    font-family:'Noto Sans TC', sans-serif; color:var(--ink);
    background: radial-gradient(circle at 10% 0%, rgba(208,155,163,0.22), transparent 50%), var(--blush);
  }
  .wrap{ max-width: 860px; margin: 0 auto; }
  header{ text-align:center; margin-bottom: 24px; }
  .eyebrow{ font-size:0.72rem; letter-spacing:0.24em; color:var(--soft); font-weight:700; text-transform:uppercase; }
  h1{ font-family:'Noto Serif TC', serif; color:var(--deep-dark); font-size:1.7rem; margin: 6px 0 4px; }
  .sub{ color:var(--ink-soft); font-size:0.9rem; }

  .toolbar{ text-align:center; margin-bottom: 22px; }
  .toolbar button{
    padding: 10px 22px; border-radius: 999px; border: 1.5px solid #eee0e3; background:#fff;
    color: var(--deep-dark); font-family:inherit; font-weight:700; cursor:pointer;
  }

  .group{
    background:#fff; border-radius: 22px; padding: 20px 22px; margin-bottom: 18px;
    box-shadow: 0 10px 26px rgba(142,63,117,0.08); border: 1px solid #f4e7ea;
  }
  .group-head{ display:flex; align-items:center; gap:10px; margin-bottom: 14px; flex-wrap:wrap; }
  .group-head .title{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:1.15rem; color: var(--deep-dark); }
  .badge-repeat{
    font-size:0.68rem; font-weight:700; padding: 3px 10px; border-radius: 999px;
    background: var(--cream); color: var(--deep);
  }
  .tags{ display:flex; flex-wrap:wrap; gap: 10px; }
  .tag{
    background: var(--cream); border-radius: 14px; padding: 10px 16px; cursor:pointer;
    text-align:center; min-width: 96px; transition: opacity .15s, transform .1s; user-select:none;
  }
  .tag:active{ transform: scale(0.97); }
  .tag .fullno{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:1.2rem; color: var(--deep); display:block; }
  .tag .wname{ font-size:0.76rem; color: var(--ink-soft); margin-top: 2px; }
  .tag.claimed{ background: var(--claimed-bg); }
  .tag.claimed .fullno{ color: var(--claimed-ink); text-decoration: line-through; }
  .tag.claimed .wname{ color: var(--claimed-ink); }
  .hint{ text-align:center; color: var(--ink-soft); font-size:0.78rem; margin: -10px 0 20px; }

  .empty-state{ text-align:center; color:var(--ink-soft); padding: 60px 0; }
  .nav{ text-align:center; margin-top: 26px; font-size:0.85rem; }
  .nav a{ color: var(--deep); text-decoration:none; font-weight:700; margin: 0 8px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Winners</div>
    <h1>中獎名單</h1>
    <p class="sub">依獎項分組顯示，點擊卡片可切換「已領獎」狀態</p>
  </header>

  <div class="toolbar"><button id="refreshBtn">🔄 重新整理</button></div>
  <p class="hint">* 點擊得獎卡片即可標記／取消「已領獎」</p>

  <div id="groups"><div class="empty-state">載入中…</div></div>

  <div class="nav">
    <a href="draw.html">回到抽獎</a> · <a href="status.html">登錄現況</a>
  </div>
</div>

<script>
// ------------ 設定區：請填入您的 Supabase 專案資訊 ------------
const SUPABASE_URL = 'https://ytfpmewrlsbvwgdfzknx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0ZnBtZXdybHNidndnZGZ6a254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzUzMTQsImV4cCI6MjA5NTExMTMxNH0.trs8nAs5oe7Qc_8FX3Y-z9yVvynAfu5omuvX-oHnm-4';
const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/lottery`;
// ---------------------------------------------------------------

async function callFn(action, data = {}) {
  const resp = await fetch(FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
    body: JSON.stringify({ action, data }),
  });
  return resp.json();
}

function renderGroups(list) {
  const container = document.getElementById('groups');
  if (!list.length) {
    container.innerHTML = '<div class="empty-state">目前還沒有中獎紀錄</div>';
    return;
  }

  // 依獎項分組，維持抽出時間新到舊的順序
  const order = [];
  const groups = {};
  list.forEach(item => {
    if (!groups[item.prize]) { groups[item.prize] = []; order.push(item.prize); }
    groups[item.prize].push(item);
  });

  container.innerHTML = order.map(prize => {
    const items = groups[prize];
    const repeatable = items[0].repeatable;
    const tagsHtml = items.map(item => `
      <div class="tag ${item.claimed ? 'claimed' : ''}" data-id="${item.id}">
        <span class="fullno">${item.fullNo}</span>
        <div class="wname">${item.name}</div>
      </div>`).join('');

    return `
      <div class="group">
        <div class="group-head">
          <span class="title">🏆 ${prize}</span>
          ${repeatable ? '<span class="badge-repeat">可回抽</span>' : ''}
        </div>
        <div class="tags">${tagsHtml}</div>
      </div>`;
  }).join('');

  container.querySelectorAll('.tag').forEach(tag => {
    tag.addEventListener('click', async () => {
      if (tag.style.pointerEvents === 'none') return;
      tag.style.pointerEvents = 'none';
      tag.style.opacity = '0.4';
      const res = await callFn('toggleClaim', { id: tag.dataset.id });
      if (res.success) {
        tag.classList.toggle('claimed', res.claimed);
      } else {
        alert('更新失敗，請重新整理後再試');
      }
      tag.style.pointerEvents = 'auto';
      tag.style.opacity = '1';
    });
  });
}

async function loadWinners() {
  document.getElementById('groups').innerHTML = '<div class="empty-state">載入中…</div>';
  const res = await callFn('winners');
  if (res.success) {
    renderGroups(res.list || []);
  } else {
    document.getElementById('groups').innerHTML = '<div class="empty-state">讀取失敗，請重新整理</div>';
  }
}

document.getElementById('refreshBtn').onclick = loadWinners;
window.onload = loadWinners;
</script>
</body>
</html>
